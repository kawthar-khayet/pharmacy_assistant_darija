# Construit l'image Docker de l'API et la met en ligne sur Azure Container Apps
# a chaque push sur main qui touche l'API (le frontend, lui, est gere par Vercel).
name: Deployer l'API

on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - "nlp/**"
      - "data/clean/**"
      - "Dockerfile"
      - "requirements.txt"
      - ".github/workflows/deployer-api.yml"
  workflow_dispatch:   # bouton "Run workflow" dans l'onglet Actions de GitHub

env:
  IMAGE: ghcr.io/${{ github.repository }}-api
  RESOURCE_GROUP: dwatalk-rg
  CONTAINER_APP: dwatalk-api

jobs:
  deployer:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # pousser l'image sur ghcr.io (registre gratuit de GitHub)
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Le cache garde les couches deja construites (pip, torch) : seules les
      # etapes touchees par la modification sont refaites
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Mettre a jour l'API sur Azure
        run: az containerapp update --name $CONTAINER_APP --resource-group $RESOURCE_GROUP --image $IMAGE:${{ github.sha }}
